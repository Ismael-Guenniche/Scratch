plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.scratchwheel'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.scratchwheel'
        minSdk 24
        targetSdk 36
        versionCode 78
        versionName '0.78'
    }

    // personal = uso propio (incluye japonés experimental). play = lo que se sube a Google Play.
    flavorDimensions 'dist'
    productFlavors {
        play {
            dimension 'dist'
            // ID en Google Play (no se puede cambiar nunca). El sabor personal sigue siendo dev.scratchwheel,
            // así que las dos versiones se pueden tener instaladas a la vez.
            applicationId 'io.github.ismaelguenniche.scratch'
        }
        personal {
            dimension 'dist'
            versionNameSuffix '-personal'
        }
    }

    // Firma de subida a Google Play: lee keystore.properties de la raíz del proyecto (no se sube a git).
    // Si no existe, la build release sale sin firmar (no se puede subir).
    def ksFile = rootProject.file('keystore.properties')
    if (ksFile.exists()) {
        def ks = new Properties()
        ksFile.withInputStream { ks.load(it) }
        signingConfigs {
            release {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Glyph Developer Kit de Nothing (Glyph Bar del Phone (4a)): solo en el sabor personal, experimental.
    personalImplementation files('libs/glyph-matrix-sdk-2.0.aar')
}
