plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.scratchwheel'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.scratchwheel'
        minSdk 24
        targetSdk 36
        versionCode 59
        versionName '0.59'
    }

    // personal = uso propio (incluye japonés experimental). play = lo que se sube a Google Play.
    flavorDimensions 'dist'
    productFlavors {
        play {
            dimension 'dist'
        }
        personal {
            dimension 'dist'
            versionNameSuffix '-personal'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
