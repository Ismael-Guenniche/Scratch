plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.scratchwheel'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.scratchwheel'
        minSdk 24
        targetSdk 36
        versionCode 28
        versionName '0.28'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
